<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demo College Gateway — Test Portal</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px system-ui, sans-serif; background: #eef1f8; color: #16192b; }
      .box { background: #fff; padding: 28px; border-radius: 14px; width: 320px;
        box-shadow: 0 8px 30px rgba(20,25,60,.12); }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p.sub { margin: 0 0 18px; color: #666c85; font-size: 13px; }
      label { display:block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
      input { width: 100%; padding: 9px 11px; font: inherit; border: 1px solid #e3e6f0; border-radius: 8px; }
      button { margin-top: 18px; width: 100%; padding: 10px; font: inherit; font-weight: 600;
        background: #2c3e9e; color: #fff; border: 0; border-radius: 9px; cursor: pointer; }
      #result { margin-top: 14px; font-weight: 600; color: #1a8a5a; }
      #mode { position: fixed; top: 10px; left: 10px; font-size: 12px; color: #666c85; }
      nav { position: fixed; bottom: 10px; font-size: 12px; color: #666c85; }
      nav a { color: #2c3e9e; margin: 0 5px; }
    </style>
  </head>
  <body>
    <p id="mode"></p>
    <div class="box">
      <h1>Demo College Gateway</h1>
      <p class="sub">Local test portal — use fake credentials only.</p>
      <form id="form">
        <label for="cg-user">User ID</label>
        <input id="cg-user" name="username" type="text" />
        <label for="cg-pass">Password</label>
        <input id="cg-pass" name="password" type="password" />
        <button id="cg-login" type="submit">Login</button>
      </form>
      <p id="result"></p>
    </div>
    <nav>
      Scenarios:
      <a href="?mode=success">success</a>
      <a href="?mode=fail">wrong password</a>
      <a href="?mode=slow">slow</a>
      <a href="?mode=redirect">redirect</a>
      <a href="?mode=expire">session expiry</a>
      <a href="?mode=unavailable">gateway down</a>
    </nav>
    <script src="test-gateway.js"></script>
  </body>
</html>

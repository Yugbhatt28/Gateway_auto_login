<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demo College Gateway — Test Portal</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px system-ui, sans-serif; background: #eef1f8; color: #16192b; }
      .box { background: #fff; padding: 28px; border-radius: 14px; width: 320px;
        box-shadow: 0 8px 30px rgba(20,25,60,.12); }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p.sub { margin: 0 0 18px; color: #666c85; font-size: 13px; }
      label { display:block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
      input { width: 100%; padding: 9px 11px; font: inherit; border: 1px solid #e3e6f0; border-radius: 8px; }
      button { margin-top: 18px; width: 100%; padding: 10px; font: inherit; font-weight: 600;
        background: #2c3e9e; color: #fff; border: 0; border-radius: 9px; cursor: pointer; }
      #result { margin-top: 14px; font-weight: 600; color: #1a8a5a; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Demo College Gateway</h1>
      <p class="sub">Local test portal — use fake credentials only.</p>
      <form id="form">
        <label for="username">User ID</label>
        <input id="username" name="username" type="text" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" />
        <button id="login" type="submit">Login</button>
      </form>
      <p id="result"></p>
    </div>
    <script src="test-gateway.js"></script>
  </body>
</html>

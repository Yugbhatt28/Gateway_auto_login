<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>College Gateway Auto Login</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon48.png" alt="" width="32" height="32" />
      <div>
        <h1>College Gateway Auto Login</h1>
        <p class="sub" id="gateway">No gateway configured</p>
      </div>
    </header>

    <section class="status" id="statusBox">
      <span class="dot" id="dot"></span>
      <div>
        <p class="state" id="state">Loading…</p>
        <p class="detail" id="detail"></p>
      </div>
    </section>

    <div class="actions">
      <button id="loginNow" class="primary">Login Now</button>
      <button id="settings" class="secondary">Settings</button>
      <button id="clear" class="danger">Clear Credentials</button>
    </div>

    <p class="foot">Credentials never leave this device.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
